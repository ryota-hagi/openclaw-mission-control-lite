<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Task (iPhone)</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#111a33; --panel2:#0f1730; --text:#e8ecff; --muted:#a8b0d6;
      --line:#22305c; --good:#2ee59d; --warn:#ffcf5a; --bad:#ff5a7a; --accent:#7aa2ff;
      --chip:#1a2650;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:var(--sans); background:linear-gradient(180deg,#070a14 0%, var(--bg) 35%, #070a14 100%); color:var(--text)}
    a{color:var(--accent)}
    .wrap{max-width:1100px; margin:0 auto; padding:16px}
    header{display:flex; gap:12px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap}
    h1{margin:0; font-size:18px}
    .sub{color:var(--muted); font-size:12px}

    .card{background:rgba(17,26,51,.85); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:0 8px 20px rgba(0,0,0,.25)}
    .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
    button,.btn{background:var(--chip); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:10px; cursor:pointer; font-size:12px}
    button:hover{border-color:#334482}
    input,select,textarea{background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:10px; font-size:12px; outline:none}
    textarea{width:100%; min-height:70px}

    .kpi{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px}
    .k{background:rgba(15,23,48,.7); border:1px solid var(--line); border-radius:12px; padding:10px}
    .k .n{font-size:18px; font-family:var(--mono)}
    .k .l{font-size:11px; color:var(--muted)}

    .board{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
    @media (max-width: 900px){ .board{grid-template-columns:1fr} }

    .col{background:rgba(15,23,48,.7); border:1px dashed rgba(34,48,92,.9); border-radius:12px; padding:10px}
    .col h2{margin:0 0 8px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center}

    .pill{font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:rgba(26,38,80,.7); color:var(--muted)}
    .chip{background:rgba(26,38,80,.8); border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:11px; color:var(--muted)}
    .tag-good{border-color:rgba(46,229,157,.35); color:#bffbe6}
    .tag-warn{border-color:rgba(255,207,90,.35); color:#fff0c2}
    .tag-bad{border-color:rgba(255,90,122,.35); color:#ffd0da}

    .task{border:1px solid var(--line); background:rgba(17,26,51,.65); border-radius:12px; padding:10px; margin:8px 0}
    .task b{font-size:12px}
    .meta{color:var(--muted); font-size:11px; margin-top:6px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
    .note{margin-top:8px; font-size:12px; color:#dfe6ff; white-space:pre-wrap; word-break:break-word}

    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
    @media (max-width: 900px){ .row{grid-template-columns:1fr} }

    .mono{font-family:var(--mono)}
    .small{font-size:11px; color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Simple Task (iPhone)</h1>
      <div class="sub">端末内保存（localStorage）/ 自分だけ / 3列タスク。機密は入れない運用推奨。</div>
    </div>
    <div class="toolbar">
      <button id="export">エクスポート</button>
      <label class="btn" for="import">インポート</label>
      <input id="import" type="file" accept="application/json" style="display:none" />
      <button id="reset">初期化</button>
    </div>
  </header>

  <section class="card" style="margin-top:12px">
    <div class="toolbar">
      <input id="q" placeholder="検索（タイトル/メモ）" style="flex:1; min-width:220px" />
      <select id="pFilter">
        <option value="">優先度: 全部</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
        <option value="P3">P3</option>
      </select>
      <select id="sort">
        <option value="created_desc">並び: 新しい順</option>
        <option value="due_asc">並び: 期限が近い順</option>
        <option value="priority">並び: 優先度順</option>
      </select>
    </div>
    <div class="kpi" id="kpi"></div>
  </section>

  <div class="row">
    <section class="card">
      <div class="toolbar" style="margin-bottom:8px">
        <input id="title" placeholder="タスク名" style="flex:1; min-width:220px" />
        <select id="prio">
          <option value="P1">P1</option>
          <option value="P2" selected>P2</option>
          <option value="P3">P3</option>
        </select>
        <input id="due" type="date" />
        <select id="status">
          <option value="todo">Todo</option>
          <option value="doing">Doing</option>
          <option value="done">Done</option>
        </select>
        <button id="add">追加</button>
      </div>
      <textarea id="note" placeholder="メモ（任意）"></textarea>
      <div class="small" style="margin-top:8px">P1=今日、P2=今週、P3=いつか。Doneは定期的に消してOK（エクスポートでバックアップ可）。</div>
    </section>

    <section class="card">
      <div class="small">Tips（iPhone）</div>
      <ul class="small">
        <li>Safariの共有→ホーム画面に追加で“アプリっぽく”使える</li>
        <li>端末内保存。別端末には引き継がれない（JSONで移行）</li>
        <li>機密（顧客名/個人情報）は入れない方が安全</li>
      </ul>
    </section>
  </div>

  <section class="card" style="margin-top:12px">
    <div class="board" id="board"></div>
  </section>
</div>

<script>
(() => {
  const KEY = 'simple_task_v1';
  const $ = (q)=>document.querySelector(q);

  const els = {
    kpi: $('#kpi'),
    board: $('#board'),
    title: $('#title'),
    prio: $('#prio'),
    due: $('#due'),
    status: $('#status'),
    note: $('#note'),
    add: $('#add'),
    q: $('#q'),
    pFilter: $('#pFilter'),
    sort: $('#sort'),
    export: $('#export'),
    import: $('#import'),
    reset: $('#reset'),
  };

  const seed = () => ({
    tasks: [
      {id: rid(), title:'サンプル: 請求書の確認', note:'10分で終わるやつ', prio:'P1', due: todayStr(), status:'todo', createdAt: Date.now()},
      {id: rid(), title:'サンプル: 記事の構成だけ作る', note:'本文は明日', prio:'P2', due:'', status:'doing', createdAt: Date.now()-3600_000},
    ]
  });

  let state = load();

  function rid(){ return Math.random().toString(16).slice(2)+'-'+Date.now().toString(16); }
  function todayStr(){
    const d=new Date();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    return `${d.getFullYear()}-${mm}-${dd}`;
  }

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return seed();
      const data = JSON.parse(raw);
      if(!data.tasks) return seed();
      return data;
    } catch { return seed(); }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); render(); }

  function esc(s){
    return String(s)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#39;');
  }

  function statusLabel(s){ return s==='todo'?'Todo':(s==='doing'?'Doing':'Done'); }
  function statusTag(s){ return s==='todo'?'tag-warn':(s==='doing'?'tag-good':'tag-bad'); }

  function prioRank(p){ return p==='P1'?1:(p==='P2'?2:3); }

  function filteredSorted(){
    const needle = (els.q.value||'').trim().toLowerCase();
    const pf = els.pFilter.value;
    let list = [...state.tasks];

    if(needle){
      list = list.filter(t => (t.title+t.note).toLowerCase().includes(needle));
    }
    if(pf){
      list = list.filter(t => t.prio===pf);
    }

    const sort = els.sort.value;
    if(sort==='created_desc'){
      list.sort((a,b)=>b.createdAt-a.createdAt);
    } else if(sort==='due_asc'){
      list.sort((a,b)=>{
        const ad=a.due||'9999-12-31';
        const bd=b.due||'9999-12-31';
        return ad.localeCompare(bd);
      });
    } else if(sort==='priority'){
      list.sort((a,b)=>prioRank(a.prio)-prioRank(b.prio));
    }

    return list;
  }

  function renderKpi(){
    const total = state.tasks.length;
    const todo = state.tasks.filter(t=>t.status==='todo').length;
    const doing = state.tasks.filter(t=>t.status==='doing').length;
    const dueToday = state.tasks.filter(t=>t.due===todayStr() && t.status!=='done').length;

    const items = [
      {n: total, l: '全タスク'},
      {n: todo, l: 'Todo'},
      {n: doing, l: 'Doing'},
    ];

    els.kpi.innerHTML='';
    items.forEach(x=>{
      const d=document.createElement('div');
      d.className='k';
      d.innerHTML = `<div class="n">${x.n}</div><div class="l">${x.l}</div>`;
      els.kpi.appendChild(d);
    });
  }

  function renderBoard(){
    const cols = [
      {key:'todo', name:'Todo'},
      {key:'doing', name:'Doing'},
      {key:'done', name:'Done'},
    ];

    const list = filteredSorted();
    els.board.innerHTML='';

    cols.forEach(col=>{
      const wrap=document.createElement('div');
      wrap.className='col';
      const tasks = list.filter(t=>t.status===col.key);
      wrap.innerHTML = `<h2>${col.name} <span class="pill">${tasks.length}</span></h2>`;

      tasks.forEach(t=>{
        const el=document.createElement('div');
        el.className='task';
        const due = t.due ? `期限:${esc(t.due)}` : '期限:—';
        el.innerHTML = `
          <div class="toolbar" style="justify-content:space-between; gap:8px">
            <div style="min-width:0">
              <b>${esc(t.title)}</b>
              <div class="meta">
                <span class="chip ${statusTag(t.status)}">${statusLabel(t.status)}</span>
                <span class="chip">${esc(t.prio)}</span>
                <span class="chip mono">${due}</span>
              </div>
            </div>
            <div class="toolbar" style="gap:6px">
              ${col.key!=='todo' ? `<button data-act="back" data-id="${t.id}">←</button>`:''}
              ${col.key!=='done' ? `<button data-act="next" data-id="${t.id}">→</button>`:''}
              <button data-act="del" data-id="${t.id}">削除</button>
            </div>
          </div>
          ${t.note ? `<div class="note">${esc(t.note)}</div>`:''}
        `;
        wrap.appendChild(el);
      });

      els.board.appendChild(wrap);
    });

    els.board.querySelectorAll('button[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id=btn.dataset.id;
        const act=btn.dataset.act;
        const t=state.tasks.find(x=>x.id===id);
        if(!t) return;
        if(act==='del'){
          if(!confirm('削除する？')) return;
          state.tasks = state.tasks.filter(x=>x.id!==id);
        } else if(act==='next'){
          t.status = (t.status==='todo') ? 'doing' : 'done';
        } else if(act==='back'){
          t.status = (t.status==='done') ? 'doing' : 'todo';
        }
        save();
      });
    });
  }

  function render(){
    renderKpi();
    renderBoard();
  }

  els.add.addEventListener('click', ()=>{
    const title = (els.title.value||'').trim();
    if(!title) return alert('タスク名を入れて');
    state.tasks.unshift({
      id: rid(),
      title,
      note: (els.note.value||'').trim(),
      prio: els.prio.value,
      due: els.due.value,
      status: els.status.value,
      createdAt: Date.now(),
    });
    els.title.value='';
    els.note.value='';
    els.due.value='';
    save();
  });

  els.q.addEventListener('input', render);
  els.pFilter.addEventListener('change', render);
  els.sort.addEventListener('change', render);

  els.export.addEventListener('click', ()=>{
    const blob=new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='simple_task_backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  els.import.addEventListener('change', async (e)=>{
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    try{
      const txt=await file.text();
      const data=JSON.parse(txt);
      if(!data.tasks) throw new Error('invalid');
      state=data;
      save();
    } catch {
      alert('JSONが不正');
    }
  });

  els.reset.addEventListener('click', ()=>{
    if(!confirm('全タスクを初期化する？')) return;
    state=seed();
    save();
  });

  render();
})();
</script>
</body>
</html>
